# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpipe.com

# Local n8n for Automation Flows (design history: docs/automation-flows/history/hackathon/SPEC.md).
# Start: docker compose -f infra/automation-flows/docker-compose.yml up -d
# Credentials (Gmail OAuth, Jira, OpenAI-compatible, ScreenPipe API) and the API key
# are created in the n8n UI and stay in the n8n_data volume, never in the repo.
# The project name is pinned so every checkout reuses the same container and
# volume (automation-flows_n8n_data: credentials, API key, workflows).
name: automation-flows
services:
  n8n:
    image: n8nio/n8n:2.42.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Custom ScreenPipe nodes (packages/n8n-nodes-screenpipe), also usable as AI Agent tools.
      - N8N_CUSTOM_EXTENSIONS=/home/node/custom-nodes
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
    extra_hosts:
      # Reach ScreenPipe (API + AI proxy on :3030) running on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./custom-nodes:/home/node/custom-nodes:ro

volumes:
  n8n_data:
